<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nettiradio</title>
  <link id="dynamic-favicon" rel="shortcut icon" href="">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .badge {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.3rem;
      margin-top: 0;
      margin-bottom: 1.5rem;
      min-height: 2.8rem;
      word-break: break-word;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }
    button {
      background: #ff4757;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }
    button:hover {
      background: #ff6b81;
    }
    button:active {
      transform: scale(0.98);
    }
    button.playing {
      background: #2ed573;
    }
    .control-group {
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      color: #aaa;
    }
    select, input[type="range"] {
      width: 100%;
      margin-top: 0.4rem;
      box-sizing: border-box;
    }
    select {
      background: #2c2c2c;
      color: white;
      border: 1px solid #444;
      padding: 0.5rem;
      border-radius: 6px;
    }
    input[type="range"] {
      accent-color: #ff4757;
      cursor: pointer;
    }
    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge" id="station-badge">Nyt soi (XFM)</div>
    <h1 id="track-title">Ladataan...</h1>

    <div class="controls">
      <button id="play-btn">Toista</button>

      <div class="control-group">
        <label for="station-select">Valitse kanava:</label>
        <select id="station-select">
          <option value="xfm">XFM</option>
          <option value="loop">Loop</option>
          <option value="hitmix">HitMix</option>
          <option value="seafm">Sea FM</option>
          <option value="loop_edm">Loop EDM</option>
        </select>
      </div>

      <div class="control-group">
        <label for="volume-slider">Äänenvoimakkuus: <span id="volume-text">70%</span></label>
        <div class="volume-container">
          <input type="range" id="volume-slider" min="0" max="100" value="70">
        </div>
      </div>
    </div>
  </div>

  <script>
    const faviconCache = {};

    const STATIONS = {
      xfm: {
        name: 'XFM',
        logo: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSSAsgwI53dMGxsBQvFF6FVSJCthQMJP6CO_s7jthpqcLmf9SqPoiD_MqsS&s=10',
        streamUrl: 'https://stream1.rcast.net/73328',
        apiUrl: 'https://xfm.ee/wp-json/xfm/v1/nowplaying?',
        isHls: false,
        parseData: (data) => {
          const rawTitle = data.title || 'Tuntematon kappale';
          if (rawTitle.includes(' - ')) {
            const [artist, title] = rawTitle.split(' - ');
            return { artist: artist.trim(), title: title.trim() };
          }
          return { artist: 'XFM', title: rawTitle };
        }
      },
      loop: {
        name: 'Loop',
        logo: 'https://img.nm-ovp.nelonenmedia.fi/v1/novelist?src=%2Ffiles%2Fpromo-items%2Fsquare%2F2024%2FLoop_2560x2560.jpg&width=640&format=webp',
        streamUrl: 'https://aud-stream-loop.nm-elemental.nelonenmedia.fi/playlist-256000.m3u8',
        apiUrl: 'https://scraper2.onlineradiobox.com/fi.loop?l=0',
        isHls: true,
        parseData: (data) => {
          const rawTitle = data.title || 'Tuntematon kappale';
          if (rawTitle.includes(' - ')) {
            const [artist, title] = rawTitle.split(' - ');
            return { artist: artist.trim(), title: title.trim() };
          }
          return { artist: 'Loop', title: rawTitle };
        }
      },
      hitmix: {
        name: 'HitMix',
        logo: 'https://img.nm-ovp.nelonenmedia.fi/v1/longbow?src=channel/6b0afe5c-1e86-4573-aa35-3e32c77dc35e/e4dd2a14-ecb5-4bd1-af86-6ac949026147.jpg&width=360&height=360',
        streamUrl: 'https://aud-stream-hitmix.nm-elemental.nelonenmedia.fi/playlist-256000.m3u8',
        apiUrl: 'https://scraper2.onlineradiobox.com/fi.hitmix?l=0',
        isHls: true,
        parseData: (data) => {
          const artist = data.iArtist || 'HitMix';
          const title = data.iName || data.title || 'Tuntematon kappale';
          return { artist: artist.trim(), title: title.trim() };
        }
      },
      seafm: {
        name: 'Sea FM',
        logo: 'https://upload.wikimedia.org/wikipedia/commons/2/23/Logo-boxed-500x500.jpg?utm_source=fi.wikipedia.org&utm_campaign=index&utm_content=original',
        streamUrl: 'https://s3.myradiostream.com:4976/listen.mp3?nocache=1786716495',
        fetchCustom: async (signal) => {
          const rawTarget = 'http://s3.myradiostream.com:4976/stats?json=1';
          
          try {
            const codetabsUrl = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(rawTarget)}`;
            const res = await fetch(codetabsUrl, { signal });
            if (res.ok) {
              const data = await res.json();
              if (data && (data.songtitle || data.title)) return data;
            }
          } catch (e) {
            if (e.name === 'AbortError') throw e;
          }

          try {
            const corsProxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(rawTarget)}&key=478b4042`;
            const res = await fetch(corsProxyUrl, { signal });
            if (res.ok) {
              const data = await res.json();
              if (data && (data.songtitle || data.title)) return data;
            }
          } catch (e) {
            if (e.name === 'AbortError') throw e;
          }

          return null;
        },
        isHls: false,
        parseData: (data) => {
          if (!data) return { artist: 'Sea FM', title: 'Kappaletietoa ei saatavilla' };
          const rawTitle = data.songtitle || data.title || 'Tuntematon kappale';
          if (rawTitle.includes(' - ')) {
            const [artist, title] = rawTitle.split(' - ');
            return { artist: artist.trim(), title: title.trim() };
          }
          return { artist: 'Sea FM', title: rawTitle };
        }
      },
      loop_edm: {
        name: 'Loop EDM',
        logo: 'https://images.zeno.fm/Mje0DpMw6ArW-lMq2iBTT4rh7JxhY1KGe9fe3gKBcHA/rs:fill:152:152/q:75/g:ce:0:0/aHR0cHM6Ly9wcm94eS56ZW5vLmZtL2NvbnRlbnQvc3RhdGlvbnMvZTlkMTBjM2ItYzNhMC00YzlkLWEwYjItNmM2ZmQ2ZDkxZGJmL2ltYWdlLz91PTE3Njk3NTUzNTcwMDA',
        streamUrl: 'https://ext-stream-pl10.nm-elemental.nelonenmedia.fi/HEE/fragments/index-128k.m3u8',
        apiUrl: 'https://scraper2.onlineradiobox.com/fi.loopedm?l=0',
        isHls: true,
        parseData: (data) => {
          const rawTitle = data.title || 'Tuntematon kappale';
          if (rawTitle.includes(' - ')) {
            const [artist, title] = rawTitle.split(' - ');
            return { artist: artist.trim(), title: title.trim() };
          }
          return { artist: 'Loop EDM', title: rawTitle };
        }
      }
    };

    const stationKeys = Object.keys(STATIONS);
    let currentStationKey = 'xfm';
    let isPlaying = false;
    let hls = null;
    let metadataInterval = null;
    let fetchController = null; // Estää vanhojen pyyntöjen vuotamisen uussille kanaville

    const trackTitleEl = document.getElementById('track-title');
    const stationBadgeEl = document.getElementById('station-badge');
    const playBtn = document.getElementById('play-btn');
    const stationSelect = document.getElementById('station-select');
    const volumeSlider = document.getElementById('volume-slider');
    const volumeText = document.getElementById('volume-text');

    const audio = new Audio();
    audio.volume = 0.7;

    function setUIPlayingState(playing) {
      isPlaying = playing;
      if (playing) {
        playBtn.textContent = 'Pysäytä';
        playBtn.classList.add('playing');
      } else {
        playBtn.textContent = 'Toista';
        playBtn.classList.remove('playing');
      }
    }

    audio.addEventListener('play', () => setUIPlayingState(true));
    audio.addEventListener('pause', () => setUIPlayingState(false));

    audio.addEventListener('error', (e) => {
      console.error('Audio playback error:', e);
      stopAudio();
    });

    function setOptimizedFavicon(stationKey, imageUrl) {
      const link = document.getElementById('dynamic-favicon');
      if (faviconCache[stationKey]) {
        link.href = faviconCache[stationKey];
        return;
      }
      const img = new Image();
      img.crossOrigin = 'Anonymous';
      img.src = imageUrl;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 16;
        canvas.height = 16;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, 16, 16);
        const dataUrl = canvas.toDataURL('image/png');
        faviconCache[stationKey] = dataUrl;
        link.href = dataUrl;
      };
      img.onerror = () => { link.href = imageUrl; };
    }

    function updateMetadata(stationKey, trackInfo) {
      // Varmistetaan vielä varmuuden vuoksi, että päivitettävä kanava on yhä valittuna
      if (currentStationKey !== stationKey) return;

      const station = STATIONS[stationKey];
      document.title = `${trackInfo.artist} - ${trackInfo.title} | ${station.name}`;
      trackTitleEl.textContent = `${trackInfo.artist} - ${trackInfo.title}`;

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: trackInfo.title,
          artist: trackInfo.artist,
          album: station.name,
          artwork: [{ src: station.logo, sizes: '512x512', type: 'image/png' }]
        });
      }
    }

    async function fetchNowPlaying() {
      // Peruutetaan edellinen aktiivinen fetch-pyyntö heti uuden haun alkaessa
      if (fetchController) {
        fetchController.abort();
      }
      fetchController = new AbortController();
      const signal = fetchController.signal;

      const targetStationKey = currentStationKey;
      const station = STATIONS[targetStationKey];
      let trackInfo = { artist: station.name, title: 'Kappaletietoa ei saatavilla' };

      try {
        if (station.fetchCustom) {
          const data = await station.fetchCustom(signal);
          if (data && currentStationKey === targetStationKey) {
            trackInfo = station.parseData(data);
          }
        } else if (station.apiUrl) {
          const response = await fetch(station.apiUrl, { signal });
          if (response.ok) {
            const data = await response.json();
            if (data && currentStationKey === targetStationKey) {
              trackInfo = station.parseData(data);
            }
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          return; // Pyyntö peruutettiin tarkoituksella kanavan vaihdon vuoksi
        }
        console.error(`Metadata haku epäonnistui kanavalle ${station.name}:`, err);
      }

      if (currentStationKey === targetStationKey) {
        updateMetadata(targetStationKey, trackInfo);
      }
    }

    function startMetadataInterval() {
      if (metadataInterval) clearInterval(metadataInterval);
      
      const station = STATIONS[currentStationKey];
      setOptimizedFavicon(currentStationKey, station.logo);
      
      fetchNowPlaying();
      metadataInterval = setInterval(fetchNowPlaying, 30000);
    }

    async function playAudio() {
      const station = STATIONS[currentStationKey];
      
      stopAudio();

      if (station.isHls) {
        if (Hls.isSupported()) {
          if (hls) hls.destroy();
          hls = new Hls();
          hls.loadSource(station.streamUrl);
          hls.attachMedia(audio);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            audio.play().catch(e => {
              console.error("HLS Playback failed:", e);
              setUIPlayingState(false);
            });
          });
        } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
          audio.src = station.streamUrl;
          try {
            await audio.play();
          } catch (e) {
            console.error("Native HLS Playback failed:", e);
            setUIPlayingState(false);
          }
        } else {
            alert("Selaimesi ei tue HLS-toistoa.");
        }
      } else {
        audio.src = station.streamUrl;
        try {
          await audio.play();
        } catch (e) {
          console.error("Direct Playback failed:", e);
          setUIPlayingState(false);
        }
      }
    }

    function stopAudio() {
      audio.pause();
      if (hls) {
        hls.destroy();
        hls = null;
      }
      audio.src = '';
      setUIPlayingState(false);
    }

    function switchStation(newKey) {
      const wasPlaying = isPlaying;
      stopAudio();

      // Keskeytetään heti mahdolliset taustalla roikkuvat Sea FM:n tai muiden pyynnöt
      if (fetchController) {
        fetchController.abort();
        fetchController = null;
      }

      currentStationKey = newKey;
      stationSelect.value = currentStationKey;
      const station = STATIONS[currentStationKey];
      
      stationBadgeEl.textContent = `Nyt soi (${station.name})`;
      trackTitleEl.textContent = 'Ladataan...';
      
      startMetadataInterval();

      if (wasPlaying) {
        playAudio();
      }
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        stopAudio();
      } else {
        playAudio();
      }
    });

    stationSelect.addEventListener('change', (e) => {
      switchStation(e.target.value);
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      audio.volume = val / 100;
      volumeText.textContent = `${val}%`;
    });

    startMetadataInterval();

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => playAudio());
      navigator.mediaSession.setActionHandler('pause', () => stopAudio());
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        const currentIndex = stationKeys.indexOf(currentStationKey);
        const nextIndex = (currentIndex + 1) % stationKeys.length;
        switchStation(stationKeys[nextIndex]);
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        const currentIndex = stationKeys.indexOf(currentStationKey);
        const prevIndex = (currentIndex - 1 + stationKeys.length) % stationKeys.length;
        switchStation(stationKeys[prevIndex]);
      });
    }
  </script>
</body>
</html>
